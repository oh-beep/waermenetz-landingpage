name: Labor verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: node --test scripts/*.test.mjs
      - name: Install pinned form service dependencies
        working-directory: services/waermenetz-doi
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Test form service with synthetic provider
        working-directory: services/waermenetz-doi
        run: npm test
