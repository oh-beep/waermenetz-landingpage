name: Deploy Waermenetz Landingpage
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character lowercase commit SHA
        required: true
        type: string
      confirm_live:
        description: Type LIVE-DEPLOY-FREIGEGEBEN to authorize deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Validate release gate before checkout
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRM_LIVE: ${{ inputs.confirm_live }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          [[ "$CONFIRM_LIVE" == "LIVE-DEPLOY-FREIGEGEBEN" ]] || { echo "explicit live confirmation required" >&2; exit 1; }

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify checked out SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "checkout SHA mismatch" >&2; exit 1; }

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Files
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.gitignore' --exclude 'README.md' \
            --exclude '*.sh' --exclude '.env' --exclude 'scripts/' --exclude 'google-apps-script.js' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/waermenetz.hhb-agrarenergie.de/

      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'sudo nginx -t && sudo systemctl reload nginx && echo "Deploy OK"'
